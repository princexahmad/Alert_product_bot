services:
  - type: worker
    name: telegram-price-tracker-bot

    env: python

    plan: free

    buildCommand: pip install -r requirements.txt

    startCommand: python main.py

    autoDeploy: true

    envVars:
      - key: TELEGRAM_TOKEN
        sync: false

      - key: SUPABASE_URL
        sync: false

      - key: SUPABASE_KEY
        sync: false

      - key: CHECK_INTERVAL
        value: "15"

      - key: REQUEST_TIMEOUT
        value: "30"

      - key: LOG_LEVEL
        value: "INFO"
